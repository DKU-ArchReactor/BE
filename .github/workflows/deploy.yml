name: Deploy core to Elastic Beanstalk

on:
  push:
    branches: [core]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beanstalk-core
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    if: github.ref == 'refs/heads/core'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      AWS_ACCOUNT_ID: '242925688392'
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'capstone/archreactor' }}
      EB_APPLICATION_NAME: ${{ vars.EB_APPLICATION_NAME }}
      EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME }}
      EB_DEPLOY_BUCKET: ${{ vars.EB_DEPLOY_BUCKET }}
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || 'https://d1j3nkcez6kncs.cloudfront.net' }}
      VERSION_LABEL: core-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment variables
        run: |
          for name in AWS_ROLE_ARN EB_APPLICATION_NAME EB_ENVIRONMENT_NAME EB_DEPLOY_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::Set repository variable $name before deploying."
              exit 1
            fi
          done

      - name: Authenticate to AWS using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify the target AWS account
        run: |
          ACTUAL_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACTUAL_ACCOUNT_ID" != "$AWS_ACCOUNT_ID" ]; then
            echo "::error::Expected AWS account $AWS_ACCOUNT_ID, got $ACTUAL_ACCOUNT_ID."
            exit 1
          fi

      - name: Check the existing Beanstalk environment
        run: |
          aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION_NAME" \
            --environment-names "$EB_ENVIRONMENT_NAME" > /tmp/eb-environment.json
          jq -e '.Environments | length == 1' /tmp/eb-environment.json
          jq -e '.Environments[0].Status == "Ready"' /tmp/eb-environment.json

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the production image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$VERSION_LABEL"
          docker build --platform linux/amd64 -f Dockerfile.prod -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Package the Beanstalk application version
        run: python scripts/package-beanstalk.py "$IMAGE_URI" dist/beanstalk.zip

      - name: Upload and deploy
        run: |
          KEY="archreactor/$VERSION_LABEL.zip"
          aws s3 cp dist/beanstalk.zip "s3://$EB_DEPLOY_BUCKET/$KEY"
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION_NAME" \
            --version-label "$VERSION_LABEL" \
            --source-bundle "S3Bucket=$EB_DEPLOY_BUCKET,S3Key=$KEY"
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT_NAME" \
            --version-label "$VERSION_LABEL"
          aws elasticbeanstalk wait environment-updated \
            --environment-names "$EB_ENVIRONMENT_NAME"

      - name: Verify deployed version and environment health
        run: |
          for attempt in $(seq 1 30); do
            aws elasticbeanstalk describe-environments \
              --environment-names "$EB_ENVIRONMENT_NAME" > /tmp/eb-result.json
            if jq -e --arg version "$VERSION_LABEL" \
              '.Environments[0] | .VersionLabel == $version and .Status == "Ready" and .Health == "Green"' \
              /tmp/eb-result.json; then
              URL="$PUBLIC_API_URL"
              curl --fail --silent --show-error --location --retry 3 --max-time 20 "$URL/" | \
                jq -e '.status == "ok"'
              echo "Deployed $VERSION_LABEL to $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The requested version did not become healthy. Check Beanstalk events and logs."
          exit 1
