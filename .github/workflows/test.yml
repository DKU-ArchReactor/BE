name: Test

on:
  pull_request:
    branches: [develop, main, core]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: archreactor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-password@localhost:5432/archreactor_test
      DEBUG: 'false'
      CORE_SOURCE: ${{ github.workspace }}/_core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout reviewed CORE adapter candidate
        uses: actions/checkout@v4
        with:
          repository: DKU-ArchReactor/CORE
          ref: 292f16a9fcc293eae3b874d93d10bc26174f8396
          path: _core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r _core/requirements-server.txt
          sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Run tests
        run: pytest
